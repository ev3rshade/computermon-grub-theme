# Test config embedded in the standalone GRUB EFI image. Entries are dummies.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod fat
insmod part_msdos
insmod part_gpt

search --no-floppy --file --set=root /boot/grub/themes/computermon/theme.txt

set gfxmode=1024x768,auto
set gfxpayload=keep
terminal_output gfxterm
for size in 8 16 24; do loadfont ($root)/boot/grub/themes/computermon/press_start_$size.pf2; done
set theme=($root)/boot/grub/themes/computermon/theme.txt
set timeout_style=menu
set timeout=30

menuentry "MizuOS" --class mizuos { echo "Would boot MizuOS"; sleep 3 }
menuentry "KusaOS" --class kusaos { echo "Would boot KusaOS"; sleep 3 }
menuentry "HonouOS" --class honouos { echo "Would boot HonouOS"; sleep 3 }
menuentry "Recovery Mode" --class recovery { echo "Would boot recovery"; sleep 3 }
menuentry "UEFI Settings" --class efi { fwsetup }
